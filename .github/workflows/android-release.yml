name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" > /dev/null
          # compileSdk 37 对应的平台包名可能是 android-37 或带次版本的 android-37.0
          for pkg in "platforms;android-37" "platforms;android-37.0"; do
            if sdkmanager "$pkg" > /dev/null 2>&1; then
              echo "Installed $pkg"
              break
            fi
          done
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置签名 Secrets，本次将产出未签名 APK"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Check version consistency
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VERSION versionName=$VERSION_NAME"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::warning::Tag ($TAG_VERSION) 与 versionName ($VERSION_NAME) 不一致，请确认是否需要同步更新 app/build.gradle.kts"
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect release artifacts
        id: apk
        run: |
          ls -lh app/build/outputs/apk/release/
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            OUTPUT_NAME="Koishi-${GITHUB_REF_NAME}.apk"
          else
            OUTPUT_NAME="Koishi-unsigned.apk"
          fi
          cp "$APK_PATH" "$OUTPUT_NAME"
          echo "named=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: koishi-release-apk
          path: ${{ steps.apk.outputs.named }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Koishi ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.named }}
          generate_release_notes: true
          draft: false
          prerelease: false
