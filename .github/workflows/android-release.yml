name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build Release Bundle
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Clean Sensitive Credentials
        if: always()
        run: |
          rm -f release.keystore keystore.properties

      - name: Collect Release Artifacts
        id: collect_artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${GITHUB_REF_NAME}"

          # Collect APKs (ABI splits & universal)
          for apk in $(find app/build/outputs/apk/release -name "*.apk"); do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk" .apk)
              abi_part=$(echo "$filename" | sed -E 's/^app(-)?//' | sed -E 's/(-)?release$//')
              if [ -n "$abi_part" ]; then
                target="Koishi-${TAG_NAME}-${abi_part}.apk"
              else
                target="Koishi-${TAG_NAME}.apk"
              fi
              cp "$apk" "release-artifacts/$target"
              echo "Collected APK: $target"
            fi
          done

          # Collect AAB (App Bundle)
          for aab in $(find app/build/outputs/bundle/release -name "*.aab"); do
            if [ -f "$aab" ]; then
              target="Koishi-${TAG_NAME}.aab"
              cp "$aab" "release-artifacts/$target"
              echo "Collected AAB: $target"
            fi
          done

          if [ -z "$(ls -A release-artifacts)" ]; then
            echo "::error::未找到生成的发布产物"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koishi-release-artifacts
          path: release-artifacts/*
          if-no-files-found: error

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        continue-on-error: true
        with:
          config: github
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_CHANGELOG.md

      - name: Check Changelog Status
        id: changelog_check
        run: |
          if [ -s "RELEASE_CHANGELOG.md" ]; then
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Koishi ${{ github.ref_name }}
          files: release-artifacts/*
          body_path: ${{ steps.changelog_check.outputs.has_changelog == 'true' && 'RELEASE_CHANGELOG.md' || '' }}
          generate_release_notes: ${{ steps.changelog_check.outputs.has_changelog != 'true' }}
          draft: false
          prerelease: false